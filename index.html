<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080a0d">
<title>MT Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080a0d;
  color:#fff;
  min-height:100vh;
}
button,input,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

#authScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.auth-box{
  width:100%;
  max-width:430px;
  background:#11151a;
  border:1px solid #292f36;
  border-radius:24px;
  padding:28px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.logo{
  text-align:center;
  color:#42e695;
  font-size:38px;
  font-weight:800;
  margin-bottom:7px;
}
.subtitle{
  text-align:center;
  color:#9aa4af;
  margin-bottom:25px;
}
.auth-tabs{
  display:flex;
  background:#080a0d;
  padding:4px;
  border-radius:13px;
  margin-bottom:20px;
}
.auth-tabs button{
  flex:1;
  border:0;
  background:transparent;
  color:#9aa4af;
  padding:13px 8px;
  border-radius:10px;
}
.auth-tabs button.active{
  background:#42e695;
  color:#07100b;
  font-weight:bold;
}
.form-group{margin-bottom:14px}
.form-group label{
  display:block;
  color:#dce2e8;
  font-weight:bold;
  margin-bottom:7px;
}
.form-group input{
  width:100%;
  padding:15px;
  border-radius:13px;
  border:1px solid #303841;
  background:#080a0d;
  color:#fff;
  outline:none;
}
.form-group input:focus{border-color:#42e695}
.main-btn{
  width:100%;
  padding:15px;
  margin-top:7px;
  border:0;
  border-radius:13px;
  background:#42e695;
  color:#07100b;
  font-weight:bold;
}
.main-btn:disabled{opacity:.6}
.secondary-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#4da3ff;
  padding:12px;
  margin-top:7px;
}
.auth-message{
  min-height:22px;
  text-align:center;
  margin-top:15px;
  color:#ffcc66;
  font-size:14px;
  line-height:1.4;
}

#appScreen{
  width:100%;
  max-width:700px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}
.header{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 16px;
  background:rgba(8,10,13,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #252b32;
}
.brand{color:#42e695;font-size:25px;font-weight:800}
.logout-btn{
  border:1px solid #303841;
  background:#11151a;
  color:#fff;
  padding:8px 12px;
  border-radius:10px;
}
.stories{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:16px;
  scrollbar-width:none;
}
.stories::-webkit-scrollbar{display:none}
.story{
  min-width:72px;
  text-align:center;
  color:#b8c0c8;
  font-size:12px;
}
.story-circle{
  width:60px;
  height:60px;
  margin:0 auto 6px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#42e695,#20a4f3);
  color:#07100b;
  font-weight:bold;
  font-size:18px;
}
.composer,.post,.profile-box{
  margin:0 16px 15px;
  padding:16px;
  background:#11151a;
  border:1px solid #252b32;
  border-radius:18px;
}
.composer textarea{
  width:100%;
  min-height:85px;
  resize:none;
  border:1px solid #303841;
  background:#080a0d;
  color:#fff;
  border-radius:13px;
  padding:13px;
  outline:none;
}
.composer textarea:focus{border-color:#42e695}
.post-name{font-weight:bold;margin-bottom:5px}
.post-time{color:#7f8994;font-size:12px;margin-bottom:12px}
.post-text{line-height:1.55;white-space:pre-wrap;word-break:break-word}
.actions{display:flex;gap:8px;margin-top:15px}
.actions button{
  flex:1;
  border:1px solid #303841;
  background:#080a0d;
  color:#dce2e8;
  padding:10px 5px;
  border-radius:10px;
}
.actions button.liked{color:#42e695;border-color:#42e695}
.profile-box{text-align:center}
.profile-avatar{
  width:70px;height:70px;margin:0 auto 10px;
  border-radius:50%;
  background:#42e695;color:#07100b;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:bold;
}
.bottom-nav{
  position:fixed;
  z-index:30;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(700px,100%);
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:10px 5px;
  background:rgba(17,21,26,.96);
  backdrop-filter:blur(12px);
  border-top:1px solid #252b32;
}
.bottom-nav button{
  border:0;background:transparent;color:#9aa4af;
  font-size:12px;min-width:55px;
}
.plus-btn{
  width:45px!important;
  min-width:45px!important;
  height:45px;
  border-radius:50%!important;
  background:#42e695!important;
  color:#07100b!important;
  font-size:25px!important;
}
@media(max-width:480px){
  .auth-box{padding:25px 18px}
  .logo{font-size:34px}
}
</style>
</head>

<body>

<section id="authScreen">
  <div class="auth-box">
    <div class="logo">MT Social</div>
    <div class="subtitle">Connect • Share • Enjoy</div>

    <div class="auth-tabs">
      <button id="loginTab" class="active" type="button">Login</button>
      <button id="signupTab" type="button">Signup</button>
    </div>

    <div id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input id="loginEmail" type="email" autocomplete="email" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password">
      </div>
      <button id="loginButton" class="main-btn" type="button">Login</button>
      <button id="forgotButton" class="secondary-btn" type="button">Password भूल गए?</button>
    </div>

    <div id="signupForm" class="hidden">
      <div class="form-group">
        <label>Name</label>
        <input id="signupName" type="text" autocomplete="name" placeholder="आपका नाम">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input id="signupEmail" type="email" autocomplete="email" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input id="signupPassword" type="password" autocomplete="new-password" placeholder="कम से कम 6 characters">
      </div>
      <button id="signupButton" class="main-btn" type="button">Create Account</button>
    </div>

    <div id="authMessage" class="auth-message"></div>
  </div>
</section>

<section id="appScreen" class="hidden">
  <header class="header">
    <div class="brand">MT Social</div>
    <button id="logoutButton" class="logout-btn" type="button">Logout</button>
  </header>

  <div class="stories">
    <div class="story"><div class="story-circle">+</div>Your Story</div>
    <div class="story"><div class="story-circle">MT</div>Friends</div>
    <div class="story"><div class="story-circle">😊</div>Friends</div>
    <div class="story"><div class="story-circle">🔥</div>Trending</div>
  </div>

  <div class="composer">
    <textarea id="postText" placeholder="What's on your mind?"></textarea>
    <button id="postButton" class="main-btn" type="button">Post</button>
  </div>

  <div id="profileBox" class="profile-box hidden">
    <div id="profileAvatar" class="profile-avatar">U</div>
    <h3 id="profileName">User</h3>
    <p id="profileEmail" style="color:#9aa4af;margin-top:6px;">email</p>
  </div>

  <main id="feed">
    <article class="post">
      <div class="post-name">MT Social</div>
      <div class="post-time">Welcome 👋</div>
      <div class="post-text">Welcome to MT Social! 🎉

आपका अपना social platform.</div>
      <div class="actions">
        <button type="button" onclick="likePost(this)">❤️ Like</button>
        <button type="button" onclick="commentPost()">💬 Comment</button>
        <button type="button" onclick="sharePost()">↗️ Share</button>
      </div>
    </article>
  </main>

  <nav class="bottom-nav">
    <button type="button" onclick="goHome()">🏠<br>Home</button>
    <button type="button">👥<br>Friends</button>
    <button type="button" class="plus-btn" onclick="focusPost()">+</button>
    <button type="button">💬<br>Messages</button>
    <button type="button" onclick="showProfile()">👤<br>Profile</button>
  </nav>
</section>

<script>
const SUPABASE_URL = "https://rtlfxlfrktefhgvtjwuc.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_NAbD-ncXJwYvR8gKgL9Ulg_KZaDNrJ-";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const $ = id => document.getElementById(id);

const authScreen = $("authScreen");
const appScreen = $("appScreen");
const loginForm = $("loginForm");
const signupForm = $("signupForm");
const loginTab = $("loginTab");
const signupTab = $("signupTab");
const authMessage = $("authMessage");

function showMessage(message, error=false){
  authMessage.textContent = message;
  authMessage.style.color = error ? "#ff7777" : "#ffcc66";
}

function showLogin(){
  loginForm.classList.remove("hidden");
  signupForm.classList.add("hidden");
  loginTab.classList.add("active");
  signupTab.classList.remove("active");
  showMessage("");
}

function showSignup(){
  signupForm.classList.remove("hidden");
  loginForm.classList.add("hidden");
  signupTab.classList.add("active");
  loginTab.classList.remove("active");
  showMessage("");
}

loginTab.addEventListener("click", showLogin);
signupTab.addEventListener("click", showSignup);

async function signup(){
  const name = $("signupName").value.trim();
  const email = $("signupEmail").value.trim();
  const password = $("signupPassword").value;

  if(!name || !email || !password){
    showMessage("कृपया सभी जानकारी भरें।", true);
    return;
  }

  if(password.length < 6){
    showMessage("Password कम से कम 6 characters का होना चाहिए।", true);
    return;
  }

  const button = $("signupButton");
  button.disabled = true;
  button.textContent = "Account बन रहा है...";

  try{
    const {data,error} = await supabaseClient.auth.signUp({
      email,
      password,
      options:{
        data:{name},
        emailRedirectTo: window.location.origin + window.location.pathname
      }
    });

    if(error) throw error;

    if(data.session){
      showMessage("Account बन गया! 🎉");
      openApp(data.user);
    }else{
      showMessage("Account बन गया! 📧 Email में verification link खोलें, फिर Login करें।");
    }
  }catch(error){
    console.error(error);
    showMessage(error.message || "Signup में समस्या हुई।", true);
  }finally{
    button.disabled = false;
    button.textContent = "Create Account";
  }
}

async function login(){
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  if(!email || !password){
    showMessage("Email और Password भरें।", true);
    return;
  }

  const button = $("loginButton");
  button.disabled = true;
  button.textContent = "Login हो रहा है...";

  try{
    const {data,error} = await supabaseClient.auth.signInWithPassword({
      email,password
    });

    if(error) throw error;

    showMessage("Login सफल हुआ! 🎉");
    openApp(data.user);
  }catch(error){
    console.error(error);
    showMessage(error.message || "Login में समस्या हुई।", true);
  }finally{
    button.disabled = false;
    button.textContent = "Login";
  }
}

$("loginButton").addEventListener("click", login);
$("signupButton").addEventListener("click", signup);

$("loginPassword").addEventListener("keydown", e => {
  if(e.key === "Enter") login();
});
$("signupPassword").addEventListener("keydown", e => {
  if(e.key === "Enter") signup();
});

$("forgotButton").addEventListener("click", async () => {
  const email = $("loginEmail").value.trim();

  if(!email){
    showMessage("पहले अपना email डालें।", true);
    return;
  }

  try{
    const {error} = await supabaseClient.auth.resetPasswordForEmail(
      email,
      {redirectTo: window.location.origin + window.location.pathname}
    );

    if(error) throw error;
    showMessage("Password reset link आपके email पर भेज दिया गया है। 📧");
  }catch(error){
    console.error(error);
    showMessage(error.message || "Password reset में समस्या हुई।", true);
  }
});

function openApp(user){
  authScreen.classList.add("hidden");
  appScreen.classList.remove("hidden");
  updateProfile(user);
}

function updateProfile(user){
  if(!user) return;

  const name =
    user.user_metadata?.name ||
    user.email?.split("@")[0] ||
    "User";

  $("profileName").textContent = name;
  $("profileEmail").textContent = user.email || "";
  $("profileAvatar").textContent = name.charAt(0).toUpperCase();
}

$("logoutButton").addEventListener("click", async () => {
  await supabaseClient.auth.signOut();
  appScreen.classList.add("hidden");
  authScreen.classList.remove("hidden");
  $("profileBox").classList.add("hidden");
  showLogin();
});

supabaseClient.auth.onAuthStateChange((event, session) => {
  if(session) openApp(session.user);
});

async function checkSession(){
  try{
    const {data,error} = await supabaseClient.auth.getSession();
    if(error){
      console.error(error);
      return;
    }
    if(data.session) openApp(data.session.user);
    else showLogin();
  }catch(error){
    console.error(error);
  }
}

function createPost(){
  const textarea = $("postText");
  const text = textarea.value.trim();

  if(!text){
    alert("पहले कुछ लिखें।");
    textarea.focus();
    return;
  }

  const post = document.createElement("article");
  post.className = "post";

  post.innerHTML = `
    <div class="post-name">You</div>
    <div class="post-time">Just now</div>
    <div class="post-text"></div>
    <div class="actions">
      <button type="button" onclick="likePost(this)">❤️ Like</button>
      <button type="button" onclick="commentPost()">💬 Comment</button>
      <button type="button" onclick="sharePost()">↗️ Share</button>
    </div>
  `;

  post.querySelector(".post-text").textContent = text;
  $("feed").prepend(post);
  textarea.value = "";
}

$("postButton").addEventListener("click", createPost);

function likePost(button){
  button.classList.toggle("liked");
}

function commentPost(){
  alert("Comment feature coming soon!");
}

function sharePost(){
  alert("Share feature coming soon!");
}

function focusPost(){
  $("postText").focus();
  $("postText").scrollIntoView({behavior:"smooth",block:"center"});
}

function goHome(){
  $("profileBox").classList.add("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}

function showProfile(){
  $("profileBox").classList.remove("hidden");
  $("profileBox").scrollIntoView({behavior:"smooth",block:"center"});
}

checkSession();
</script>

</body>
    </html>
