<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MT Social 🇮🇳</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f2f4f7;color:#111;padding-bottom:70px}
header{background:#fff;padding:15px;position:sticky;top:0;box-shadow:0 1px 5px #ccc}
.logo{font-size:25px;font-weight:bold;color:#087f5b}.tag{font-size:12px;color:#666}
.wrap{max-width:600px;margin:auto;padding:15px}.card{background:#fff;padding:18px;border-radius:16px;margin-bottom:15px;box-shadow:0 2px 8px #ddd}
input,textarea{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
button{border:0;border-radius:10px;padding:12px 16px;background:#087f5b;color:white;font-weight:bold;margin:4px;cursor:pointer}
.secondary{background:#e7f4ef;color:#087f5b}.hidden{display:none}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px;text-align:center;box-shadow:0 -2px 8px #ddd}.post{white-space:pre-wrap;line-height:1.5}.avatar{width:65px;height:65px;border-radius:50%;background:#087f5b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px}
</style>
</head>
<body>
<header><div class="logo">MT Social 🇮🇳</div><div class="tag">भारत के लिए • भारत का अपना social app</div></header>
<div class="wrap">
<section id="auth" class="card">
<h2>MT Social में स्वागत है 👋</h2>
<button onclick="loginBox()">Login</button><button class="secondary" onclick="signupBox()">Signup</button>
<div id="loginForm">
<input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password">
<button onclick="login()">Login करें</button>
</div>
<div id="signupForm" class="hidden">
<input id="name" placeholder="आपका नाम"><input id="semail" type="email" placeholder="Email"><input id="spassword" type="password" placeholder="Password">
<button onclick="signup()">Account बनाएं</button>
</div>
<p id="msg"></p>
</section>

<section id="app" class="hidden">
<div id="home">
<div class="card"><h2>नमस्ते, <span id="hello">दोस्त</span> 👋</h2>
<textarea id="postText" rows="4" placeholder="आज क्या कहना चाहते हैं? ✍️"></textarea>
<button onclick="createPost()">Post करें</button></div>
<div id="feed"></div>
</div>
<div id="profile" class="hidden card">
<div class="avatar" id="avatar">M</div><h2 id="pname">नाम</h2><p id="pemail"></p>
<input id="editName" placeholder="नाम"><input id="username" placeholder="@username"><textarea id="bio" placeholder="Bio"></textarea>
<button onclick="saveProfile()">Profile Save करें</button><button class="secondary" onclick="logout()">Logout</button>
<p id="pmsg"></p>
</div>
</section>
</div>
<div id="nav" class="nav hidden"><button onclick="home()">🏠 Home</button><button onclick="profile()">👤 Profile</button></div>

<script>
const URL="https://rtlfxlfrktefhgvtjwuc.supabase.co";
const KEY="sb_publishable_NAbD-ncXJwYvR8gKgL9Ulg_KZaDNrJ-";
let supa,user;

function loginBox(){document.getElementById("loginForm").classList.remove("hidden");document.getElementById("signupForm").classList.add("hidden")}
function signupBox(){document.getElementById("signupForm").classList.remove("hidden");document.getElementById("loginForm").classList.add("hidden")}

async function signup(){
 let email=document.getElementById("semail").value.trim(),password=document.getElementById("spassword").value,name=document.getElementById("name").value.trim();
 let r=await supa.auth.signUp({email,password,data:{name}});
 document.getElementById("msg").textContent=r.error?r.error.message:"Signup हो गया। Email verification करें अगर मांगा जाए।";
}
async function login(){
 let r=await supa.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});
 if(r.error){document.getElementById("msg").textContent=r.error.message;return} user=r.data.user;openApp();
}
async function logout(){await supa.auth.signOut();location.reload()}
function openApp(){document.getElementById("auth").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("nav").classList.remove("hidden");loadProfile();loadPosts()}
function home(){document.getElementById("home").classList.remove("hidden");document.getElementById("profile").classList.add("hidden")}
function profile(){document.getElementById("home").classList.add("hidden");document.getElementById("profile").classList.remove("hidden");loadProfile()}

async function loadProfile(){
 let r=await supa.from("profiles").select("*").eq("id",user.id).maybeSingle();
 let n=r.data?.name||user.user_metadata?.name||"MT User";
 document.getElementById("hello").textContent=n;document.getElementById("pname").textContent=n;document.getElementById("pemail").textContent=user.email||"";
 document.getElementById("editName").value=r.data?.name||n;document.getElementById("username").value=r.data?.username||"";document.getElementById("bio").value=r.data?.bio||"";document.getElementById("avatar").textContent=n[0]?.toUpperCase()||"M";
}
async function saveProfile(){
 let r=await supa.from("profiles").upsert({id:user.id,name:document.getElementById("editName").value.trim(),username:document.getElementById("username").value.trim(),bio:document.getElementById("bio").value.trim()});
 document.getElementById("pmsg").textContent=r.error?r.error.message:"Profile save हो गई ✅";loadProfile();
}
async function createPost(){
 let content=document.getElementById("postText").value.trim();if(!content)return;
 let r=await supa.from("posts").insert({user_id:user.id,content});
 if(r.error){alert("Post save नहीं हुई। पहले Supabase database setup करें.");return}
 document.getElementById("postText").value="";loadPosts();
}
async function loadPosts(){
 let box=document.getElementById("feed"),r=await supa.from("posts").select("id,content,created_at").order("created_at",{ascending:false});
 if(r.error){box.innerHTML='<div class="card">Database setup अभी बाकी है।</div>';return}
 box.innerHTML=r.data.length?r.data.map(p=>'<div class="card"><div class="post">'+safe(p.content)+'</div><button onclick="like(this)">❤️ Like</button><button onclick="alert(\'Comment अगली update में आएगा 💬\')">💬 Comment</button></div>').join(""):'<div class="card">अभी कोई post नहीं है। पहली post आप करें! 🎉</div>';
}
function safe(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function like(b){b.textContent=b.textContent.includes("Liked")?"❤️ Like":"💚 Liked"}

const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=async()=>{
supa=window.supabase.createClient(URL,KEY);
let r=await supa.auth.getSession();if(r.data.session){user=r.data.session.user;openApp()}
supa.auth.onAuthStateChange((e,session)=>{if(session&&!user){user=session.user;openApp()}});
};document.head.appendChild(s);
</script>
</body></html>
