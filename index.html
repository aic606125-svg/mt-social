<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
button,
.auth-tab,
.tab,
[role="button"] {
  position: relative !important;
  z-index: 99999 !important;
  pointer-events: auto !important;
  cursor: pointer !important;
}

.auth-card,
.auth-container,
.login-container {
  position: relative !important;
  z-index: 1000 !important;
}*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#080a0d;
  color:white;
  min-height:100vh;
}

button,input,textarea{
  font:inherit;
}

.hidden{display:none!important}

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth-box{
  width:100%;
  max-width:420px;
  background:#11151a;
  border:1px solid #252b32;
  border-radius:24px;
  padding:28px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.logo{
  text-align:center;
  font-size:36px;
  font-weight:800;
  color:#42e695;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#9aa4af;
  margin-bottom:25px;
}

.tabs{
  display:flex;
  background:#080a0d;
  border-radius:12px;
  padding:4px;
  margin-bottom:20px;
}

.tabs button{
  width:50%;
  border:0;
  padding:12px;
  border-radius:9px;
  background:transparent;
  color:#9aa4af;
  cursor:pointer;
}

.tabs button.active{
  background:#42e695;
  color:#07100b;
  font-weight:bold;
}

label{
  display:block;
  margin:14px 0 7px;
  color:#dce2e8;
  font-weight:bold;
}

input,textarea{
  width:100%;
  border:1px solid #303841;
  background:#080a0d;
  color:white;
  padding:13px;
  border-radius:12px;
  outline:none;
}

input:focus,textarea:focus{
  border-color:#42e695;
}

.main-btn{
  width:100%;
  border:0;
  padding:14px;
  margin-top:20px;
  border-radius:12px;
  background:#42e695;
  color:#07100b;
  font-weight:bold;
  cursor:pointer;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#1a222b;
  color:#dce2e8;
  font-size:14px;
}

.app{
  max-width:700px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#080a0dee;
  backdrop-filter:blur(12px);
  border-bottom:1px solid #252b32;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  font-size:25px;
  font-weight:800;
  color:#42e695;
}

.logout{
  border:1px solid #303841;
  background:#11151a;
  color:white;
  padding:8px 12px;
  border-radius:10px;
}

.stories{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:16px;
}

.story{
  min-width:70px;
  text-align:center;
  font-size:12px;
  color:#b8c0c8;
}

.story-img{
  width:60px;
  height:60px;
  border-radius:50%;
  margin:auto auto 5px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#42e695,#20a4f3);
  color:#07100b;
  font-weight:bold;
}

.composer,.post{
  margin:0 16px 15px;
  background:#11151a;
  border:1px solid #252b32;
  border-radius:18px;
  padding:16px;
}

.composer textarea{
  min-height:80px;
  resize:none;
}

.post-name{
  font-weight:bold;
  margin-bottom:7px;
}

.post-time{
  color:#7f8994;
  font-size:12px;
  margin-bottom:12px;
}

.post-text{
  line-height:1.5;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.actions button{
  flex:1;
  border:1px solid #303841;
  background:#080a0d;
  color:#dce2e8;
  padding:9px;
  border-radius:10px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(700px,100%);
  background:#11151aee;
  backdrop-filter:blur(12px);
  border-top:1px solid #252b32;
  display:flex;
  justify-content:space-around;
  padding:12px 5px;
}

.bottom button{
  border:0;
  background:transparent;
  color:#9aa4af;
  font-size:13px;
}

.bottom .plus{
  background:#42e695;
  color:#07100b;
  width:45px;
  height:45px;
  border-radius:50%;
  font-size:25px;
}
</style>
</head>

<body>

<!-- LOGIN / SIGNUP -->
<div id="authScreen" class="auth">
  <div class="auth-box">

    <div class="logo">MT Social</div>
    <div class="subtitle">Connect • Share • Enjoy</div>

    <div class="tabs">
      <button id="loginTab" class="active" onclick="showLogin()">Login</button>
      <button id="signupTab" onclick="showSignup()">Signup</button>
    </div>

    <div id="loginForm">
      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="your@email.com">

      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="Password">

      <button class="main-btn" onclick="login()">Login</button>
    </div>

    <div id="signupForm" class="hidden">
      <label>Name</label>
      <input id="signupName" type="text" placeholder="Your name">

      <label>Email</label>
      <input id="signupEmail" type="email" placeholder="your@email.com">

      <label>Password</label>
      <input id="signupPassword" type="password" placeholder="At least 6 characters">

      <button class="main-btn" onclick="signup()">Create Account</button>
    </div>

    <div id="authMessage" class="message hidden"></div>

  </div>
</div>

<!-- APP -->
<div id="appScreen" class="app hidden">

<header>
  <div class="brand">MT Social</div>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="stories">
  <div class="story">
    <div class="story-img">+</div>
    Your Story
  </div>
  <div class="story">
    <div class="story-img">MT</div>
    Mohit
  </div>
  <div class="story">
    <div class="story-img">😊</div>
    Friends
  </div>
  <div class="story">
    <div class="story-img">🔥</div>
    Trending
  </div>
</div>

<div class="composer">
  <textarea id="postText" placeholder="What's on your mind?"></textarea>
  <button class="main-btn" onclick="createPost()">Post</button>
</div>

<div id="feed">

  <div class="post">
    <div class="post-name">MT Social</div>
    <div class="post-time">Welcome 👋</div>
    <div class="post-text">
      Welcome to MT Social! 🎉<br>
      आपका अपना social platform.
    </div>

    <div class="actions">
      <button onclick="likePost(this)">❤️ Like</button>
      <button onclick="commentPost()">💬 Comment</button>
      <button onclick="sharePost()">↗️ Share</button>
    </div>
  </div>

</div>

<div class="bottom">
  <button onclick="window.scrollTo({top:0,behavior:'smooth'})">🏠<br>Home</button>
  <button>👥<br>Friends</button>
  <button class="plus" onclick="document.getElementById('postText').focus()">+</button>
  <button>💬<br>Messages</button>
  <button onclick="showProfile()">👤<br>Profile</button>
</div>

</div>

<script>

/* ==============================
   SUPABASE SETTINGS
   ============================== */

const SUPABASE_URL =
"https://rtlfxlfrktefhgvtjwuc.supabase.co";

/*
  नीचे अपनी SUPABASE PUBLISHABLE KEY डालें.
  यह sb_publishable_ से शुरू होगी.
*/
const SUPABASE_PUBLISHABLE_KEY =
sb_publishable_NAbD-ncXJwYvR8gKgL9Ulg_KZaDNrJ-

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* ==============================
   AUTH SCREEN
   ============================== */

function showMessage(text){
  const box=document.getElementById("authMessage");
  box.textContent=text;
  box.classList.remove("hidden");
}

function showLogin(){
  document.getElementById("loginForm").classList.remove("hidden");
  document.getElementById("signupForm").classList.add("hidden");

  document.getElementById("loginTab").classList.add("active");
  document.getElementById("signupTab").classList.remove("active");

  document.getElementById("authMessage").classList.add("hidden");
}

function showSignup(){
  document.getElementById("signupForm").classList.remove("hidden");
  document.getElementById("loginForm").classList.add("hidden");

  document.getElementById("signupTab").classList.add("active");
  document.getElementById("loginTab").classList.remove("active");

  document.getElementById("authMessage").classList.add("hidden");
}


/* ==============================
   SIGNUP
   ============================== */

async function signup(){

  const name =
    document.getElementById("signupName").value.trim();

  const email =
    document.getElementById("signupEmail").value.trim();

  const password =
    document.getElementById("signupPassword").value;

  if(!name || !email || !password){
    showMessage("कृपया सभी जानकारी भरें।");
    return;
  }

  if(password.length < 6){
    showMessage("Password कम से कम 6 characters का होना चाहिए।");
    return;
  }

  showMessage("Account बनाया जा रहा है...");

  const {data,error} =
    await supabaseClient.auth.signUp({
      email:email,
      password:password,
      options:{
        data:{
          name:name
        }
      }
    });

  if(error){
    showMessage(error.message);
    return;
  }

  if(data.session){
    openApp(data.user);
  }else{
    showMessage(
      "Account बन गया! 📧 अपने email में confirmation link खोलें, फिर Login करें।"
    );
  }
}


/* ==============================
   LOGIN
   ============================== */

async function login(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if(!email || !password){
    showMessage("Email और password भरें।");
    return;
  }

  showMessage("Login हो रहा है...");

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email:email,
      password:password
    });

  if(error){
    showMessage(error.message);
    return;
  }

  openApp(data.user);
}


/* ==============================
   LOGOUT
   ============================== */

async function logout(){

  await supabaseClient.auth.signOut();

  document.getElementById("appScreen")
    .classList.add("hidden");

  document.getElementById("authScreen")
    .classList.remove("hidden");

  showLogin();
}


/* ==============================
   OPEN APP
   ============================== */

function openApp(user){

  document.getElementById("authScreen")
    .classList.add("hidden");

  document.getElementById("appScreen")
    .classList.remove("hidden");

}


/* ==============================
   CHECK EXISTING SESSION
   ============================== */

async function checkSession(){

  const {data} =
    await supabaseClient.auth.getSession();

  if(data.session){
    openApp(data.session.user);
  }else{
    document.getElementById("authScreen")
      .classList.remove("hidden");

    document.getElementById("appScreen")
      .classList.add("hidden");
  }
}


/* ==============================
   DEMO POST
   ============================== */

function createPost(){

  const textarea =
    document.getElementById("postText");

  const text=textarea.value.trim();

  if(!text){
    alert("पहले कुछ लिखें।");
    return;
  }

  const post=document.createElement("div");
  post.className="post";

  post.innerHTML=`
    <div class="post-name">You</div>
    <div class="post-time">Just now</div>
    <div class="post-text"></div>

    <div class="actions">
      <button onclick="likePost(this)">❤️ Like</button>
      <button onclick="commentPost()">💬 Comment</button>
      <button onclick="sharePost()">↗️ Share</button>
    </div>
  `;

  post.querySelector(".post-text").textContent=text;

  document.getElementById("feed")
    .prepend(post);

  textarea.value="";
}

function likePost(button){
  if(button.textContent.includes("❤️ Like")){
    button.textContent="❤️ Liked";
  }else{
    button.textContent="❤️ Like";
  }
}

function commentPost(){
  alert("Comments feature अगली update में आएगा।");
}

function sharePost(){
  if(navigator.share){
    navigator.share({
      title:"MT Social",
      text:"MT Social पर यह post देखें!"
    });
  }else{
    alert("Share feature आपके browser में उपलब्ध नहीं है।");
  }
}

function showProfile(){
  alert("Profile feature अगली update में आएगा।");
}


/* START */

checkSession();

</script>

</body>
</html>
<!-- MT SOCIAL LOGIN / SIGNUP -->
<script>
(function () {
  if (!window.supabase || !window.supabaseClient) {
    console.error("Supabase client नहीं मिला");
    return;
  }

  const sb = window.supabaseClient;

  const authStyle = document.createElement("style");
  authStyle.textContent = `
    #mtAuthScreen{
      position:fixed;
      inset:0;
      z-index:999999;
      background:#080a0d;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:Arial,Helvetica,sans-serif;
    }

    .mt-auth-box{
      width:100%;
      max-width:390px;
      background:#11151a;
      border:1px solid #252b32;
      border-radius:24px;
      padding:28px 22px;
      box-shadow:0 20px 60px rgba(0,0,0,.5);
    }

    .mt-logo{
      text-align:center;
      font-size:34px;
      font-weight:800;
      margin-bottom:6px;
    }

    .mt-sub{
      text-align:center;
      color:#9aa4af;
      margin-bottom:25px;
    }

    .mt-auth-box input{
      width:100%;
      padding:15px;
      margin:7px 0;
      border-radius:13px;
      border:1px solid #303740;
      background:#080a0d;
      color:white;
      font-size:16px;
      outline:none;
      box-sizing:border-box;
    }

    .mt-auth-btn{
      width:100%;
      padding:15px;
      margin-top:12px;
      border:0;
      border-radius:13px;
      background:#1877f2;
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
    }

    .mt-switch{
      text-align:center;
      margin-top:18px;
      color:#9aa4af;
    }

    .mt-switch button,
    .mt-forgot{
      background:none;
      border:0;
      color:#4da3ff;
      font-size:15px;
      cursor:pointer;
    }

    #mtAuthMsg{
      min-height:22px;
      margin-top:15px;
      text-align:center;
      color:#ffcc66;
      font-size:14px;
    }

    #mtLogoutBtn{
      position:fixed;
      top:15px;
      right:15px;
      z-index:99999;
      background:#222831;
      color:white;
      border:1px solid #39414b;
      border-radius:10px;
      padding:9px 13px;
      display:none;
    }
  `;
  document.head.appendChild(authStyle);

  const authScreen = document.createElement("div");
  authScreen.id = "mtAuthScreen";

  authScreen.innerHTML = `
    <div class="mt-auth-box">
      <div class="mt-logo">MT Social</div>
      <div class="mt-sub" id="mtAuthTitle">अपने अकाउंट में Login करें</div>

      <div id="mtNameWrap" style="display:none">
        <input id="mtName" type="text" placeholder="आपका नाम">
      </div>

      <input id="mtEmail" type="email" placeholder="Email">
      <input id="mtPassword" type="password" placeholder="Password">

      <button class="mt-auth-btn" id="mtAuthButton">Login</button>

      <div style="text-align:center;margin-top:10px">
        <button class="mt-forgot" id="mtForgot">Password भूल गए?</button>
      </div>

      <div id="mtAuthMsg"></div>

      <div class="mt-switch">
        <span id="mtSwitchText">नया अकाउंट है?</span>
        <button id="mtSwitchBtn">Sign Up</button>
      </div>
    </div>
  `;

  document.body.appendChild(authScreen);

  const logoutBtn = document.createElement("button");
  logoutBtn.id = "mtLogoutBtn";
  logoutBtn.textContent = "Logout";
  document.body.appendChild(logoutBtn);

  let signupMode = false;

  const title = document.getElementById("mtAuthTitle");
  const nameWrap = document.getElementById("mtNameWrap");
  const nameInput = document.getElementById("mtName");
  const emailInput = document.getElementById("mtEmail");
  const passwordInput = document.getElementById("mtPassword");
  const authButton = document.getElementById("mtAuthButton");
  const switchBtn = document.getElementById("mtSwitchBtn");
  const switchText = document.getElementById("mtSwitchText");
  const forgotBtn = document.getElementById("mtForgot");
  const msg = document.getElementById("mtAuthMsg");

  function message(text, error=false){
    msg.textContent = text;
    msg.style.color = error ? "#ff7777" : "#ffcc66";
  }

  function setMode(signup){
    signupMode = signup;

    if(signup){
      title.textContent = "नया अकाउंट बनाएं";
      nameWrap.style.display = "block";
      authButton.textContent = "Sign Up";
      switchText.textContent = "पहले से अकाउंट है?";
      switchBtn.textContent = "Login";
      forgotBtn.style.display = "none";
    }else{
      title.textContent = "अपने अकाउंट में Login करें";
      nameWrap.style.display = "none";
      authButton.textContent = "Login";
      switchText.textContent = "नया अकाउंट है?";
      switchBtn.textContent = "Sign Up";
      forgotBtn.style.display = "inline";
    }

    message("");
  }

  switchBtn.onclick = function(){
    setMode(!signupMode);
  };

  authButton.onclick = async function(){
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const name = nameInput.value.trim();

    if(!email || !password){
      message("Email और Password भरें", true);
      return;
    }

    if(password.length < 6){
      message("Password कम से कम 6 अक्षरों का होना चाहिए", true);
      return;
    }

    authButton.disabled = true;
    authButton.textContent = signupMode ? "Account बन रहा है..." : "Login हो रहा है...";

    try{
      if(signupMode){
        const { data, error } = await sb.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: name
            },
            emailRedirectTo: "https://aic606125-svg.github.io/mt-social/"
          }
        });

        if(error) throw error;

        if(data.session){
          message("Account बन गया! 🎉");
          authScreen.style.display = "none";
          logoutBtn.style.display = "block";
        }else{
          message("Account बन गया! 📧 Email खोलकर verification करें।");
        }

      }else{
        const { error } = await sb.auth.signInWithPassword({
          email: email,
          password: password
        });

        if(error) throw error;

        message("Login सफल हुआ! 🎉");
      }

    }catch(error){
      console.error(error);
      message(error.message || "कुछ गलत हो गया", true);
    }

    authButton.disabled = false;
    authButton.textContent = signupMode ? "Sign Up" : "Login";
  };

  forgotBtn.onclick = async function(){
    const email = emailInput.value.trim();

    if(!email){
      message("पहले अपना Email डालें", true);
      return;
    }

    try{
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: "https://aic606125-svg.github.io/mt-social/"
      });

      if(error) throw error;

      message("Password reset link आपके Email पर भेज दिया गया है 📧");

    }catch(error){
      message(error.message || "Reset link नहीं भेजा जा सका", true);
    }
  };

  logoutBtn.onclick = async function(){
    await sb.auth.signOut();
  };

  async function checkUser(){
    const { data } = await sb.auth.getSession();

    if(data.session){
      authScreen.style.display = "none";
      logoutBtn.style.display = "block";
    }else{
      authScreen.style.display = "flex";
      logoutBtn.style.display = "none";
    }
  }

  sb.auth.onAuthStateChange(function(event, session){
    if(session){
      authScreen.style.display = "none";
      logoutBtn.style.display = "block";
    }else{
      authScreen.style.display = "flex";
      logoutBtn.style.display = "none";
    }
  });

  checkUser();

})();
  </script>
