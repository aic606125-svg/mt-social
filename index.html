<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT Social</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080a0d;
  color:#fff;
}
button,input,textarea{font:inherit}
button{cursor:pointer}

.app{
  max-width:600px;
  margin:auto;
  min-height:100vh;
  background:#080a0d;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#0d1014;
  border-bottom:1px solid #252932;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:bold;
  letter-spacing:2px;
}

.logo span{color:#c447e8}

.header-btn{
  border:0;
  background:#20242c;
  color:white;
  border-radius:50%;
  width:42px;
  height:42px;
  font-size:20px;
}

.screen{padding:18px}

.auth{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.auth-box{
  width:100%;
  background:#11151b;
  border:1px solid #292e38;
  border-radius:24px;
  padding:25px;
}

.auth-title{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#888f9b;
  margin-bottom:25px;
}

.tabs{
  display:flex;
  background:#090b0f;
  border-radius:12px;
  padding:4px;
  margin-bottom:20px;
}

.tabs button{
  width:50%;
  padding:12px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:#888;
}

.tabs .active{
  background:#252a34;
  color:white;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  color:#aaa;
  font-size:14px;
  margin-bottom:7px;
}

.field input,.field textarea{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #303641;
  background:#090b0f;
  color:#fff;
  outline:none;
}

.field textarea{
  min-height:100px;
  resize:none;
}

  border:0;
  padding:14px;
