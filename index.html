<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT Social</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0d10;
  color:white;
}
header{
  padding:18px;
  position:sticky;
  top:0;
  background:#0b0d10;
  border-bottom:1px solid #222;
  z-index:5;
}
.logo{font-size:24px;font-weight:bold}
.sub{color:#888;font-size:12px;margin-top:4px}
.container{max-width:600px;margin:auto;padding:15px}
.stories{display:flex;gap:15px;overflow:auto;padding:10px 0 20px}
.story{text-align:center;font-size:12px;min-width:60px}
.avatar{
  width:58px;height:58px;border-radius:50%;
  background:linear-gradient(135deg,#ff4d6d,#7c4dff);
  display:flex;align-items:center;justify-content:center;
  font-weight:bold;margin:auto auto 5px;
}
.card{
  background:#15181d;
  border:1px solid #242830;
  border-radius:16px;
  margin-bottom:18px;
  overflow:hidden;
}
.cardhead{display:flex;align-items:center;padding:14px}
.smallavatar{
  width:40px;height:40px;border-radius:50%;
  background:#444;display:flex;align-items:center;
  justify-content:center;margin-right:10px;
}
.name{font-weight:bold}
.username{color:#888;font-size:12px}
.post{
  padding:0 15px 15px;
  font-size:16px;
  line-height:1.5;
}
.photo{
  width:100%;
  height:280px;
  background:linear-gradient(135deg,#24105c,#e94f64,#ffb347);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  font-weight:bold;
}
.actions{
  display:flex;
  gap:20px;
  padding:12px 15px;
  border-top:1px solid #242830;
}
button{
  background:none;border:0;color:white;
  font-size:15px;cursor:pointer;
}
.create{
  background:#171a20;
  padding:15px;
  border-radius:16px;
  margin-bottom:18px;
}
textarea{
  width:100%;
  background:#0e1014;
  color:white;
  border:1px solid #30343c;
  border-radius:12px;
  padding:12px;
  resize:none;
  font-size:15px;
}
.postbtn{
  margin-top:10px;
  background:#fff;color:#000;
  padding:10px 18px;border-radius:20px;
  font-weight:bold;
}
nav{
  position:fixed;
  bottom:0;left:0;right:0;
  background:#111318;
  border-top:1px solid #292d34;
  display:flex;justify-content:space-around;
  padding:12px 5px;
}
nav button{font-size:12px}
.space{height:65px}
</style>
</head>

<body>

<header>
  <div class="logo">MT SOCIAL</div>
  <div class="sub">THE QUIET SIGNAL</div>
</header>

<div class="container">

  <div class="stories">
    <div class="story"><div class="avatar">MT</div>MT</div>
    <div class="story"><div class="avatar">NS</div>NS</div>
    <div class="story"><div class="avatar">MD</div>
